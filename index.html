<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 瑜珈 & 深蹲追蹤系統 - 會員版</title>
    
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

    <style>
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        #main-app { display: none; flex-direction: column; align-items: center; width: 100%; padding-top: 20px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1>AI 瑜珈動作偵測系統</h1>
        <p>請先登入以記錄你的練習成果</p>
        <button id="google-login-btn" class="btn-google">使用 Google 帳號登入</button>
    </div>

    <div id="main-app">
        <h1>AI 動作追蹤中</h1>
        <div class="user-info" id="user-display">使用者：載入中...</div>
        
        <div class="controls">
            <button onclick="setMode('Warrior_1')" id="btn-warrior" class="active">1: 戰士一式</button>
            <button onclick="setMode('Squat')" id="btn-squat">2: 深蹲</button>
            <button onclick="setMode('Raise')" id="btn-raise">3: 平舉</button>
            <button id="logout-btn" style="background-color: #6c757d; margin-left: 15px;">登出</button>
        </div>

        <div class="video-container">
            <video id="input-video" playsinline muted autoplay></video>
            <canvas id="output-canvas"></canvas>
            <div id="mode-display">模式: 戰士一式</div>
        </div>
    </div>

    <div id="feedback-area">
        <div id="pose-results">等待偵測...</div>
        <div id="save-status"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
        import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

        // Firebase 配置 (保持不變)
        const firebaseConfig = {
            apiKey: "AIzaSyAo11biuenUBUvSCGd2GACbO7WjIr0HTfc",
            authDomain: "yoga-project-9c8fe.firebaseapp.com",
            databaseURL: "https://yoga-project-9c8fe-default-rtdb.firebaseio.com",
            projectId: "yoga-project-9c8fe",
            storageBucket: "yoga-project-9c8fe.firebasestorage.app",
            messagingSenderId: "250399910686",
            appId: "1:250399910686:web:bb9f0b98cb79b1eebc370f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let canSave = true; 

        const loginScreen = document.getElementById('login-screen');
        const mainApp = document.getElementById('main-app');
        const userDisplay = document.getElementById('user-display');

        document.getElementById('google-login-btn').onclick = () => {
            signInWithPopup(auth, provider).catch(err => alert("登入失敗: " + err.message));
        };

        document.getElementById('logout-btn').onclick = () => {
            signOut(auth);
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                loginScreen.style.display = 'none';
                mainApp.style.display = 'flex';
                userDisplay.innerText = `使用者：${user.displayName}`;
                camera.start(); 
            } else {
                currentUser = null;
                loginScreen.style.display = 'flex';
                mainApp.style.display = 'none';
            }
        });

        const videoElement = document.getElementById('input-video');
        const canvasElement = document.getElementById('output-canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const poseResultsDiv = document.getElementById('pose-results');
        const saveStatusDiv = document.getElementById('save-status');
        
        // 修正：不要在這裡寫死 width/height，改由影片載入後動態決定像素大小
        videoElement.onloadedmetadata = () => {
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;
        };

        let currentMode = "Warrior_1";

        const YOGA_DATABASE = {
            "Warrior_1": [
                { name: "L_Arm", joints: [11, 13, 15], min: 150, max: 180, msg: "左手伸直" },
                { name: "R_Arm", joints: [12, 14, 16], min: 150, max: 180, msg: "右手伸直" },
                { name: "L_Knee", joints: [23, 25, 27], min: 70, max: 110, msg: "調整左膝角度" },
                { name: "R_Knee", joints: [24, 26, 28], min: 150, max: 180, msg: "後腿打直" }
            ],
            "Squat": [
                { name: "L_Knee", joints: [23, 25, 27], min: 70, max: 100, msg: "蹲低一點" },
                { name: "R_Knee", joints: [24, 26, 28], min: 70, max: 100, msg: "蹲低一點" }
            ],
            "Raise": [
                { name: "L_Arm", joints: [11, 13, 15], min: 150, max: 180, msg: "左手伸直" }
            ]
        };

        function calculateAngle(a, b, c) {
            const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
            let angle = Math.abs(radians * 180.0 / Math.PI);
            if (angle > 180.0) angle = 360 - angle;
            return Math.round(angle);
        }

        window.setMode = (mode) => {
            currentMode = mode;
            let modeName = (mode === "Squat") ? "深蹲" : (mode === "Raise") ? "平舉" : "戰士一式";
            document.getElementById('mode-display').innerText = `模式: ${modeName}`;
            document.getElementById('btn-warrior').classList.toggle('active', mode === 'Warrior_1');
            document.getElementById('btn-squat').classList.toggle('active', mode === 'Squat');
            document.getElementById('btn-raise').classList.toggle('active', mode === 'Raise');
            canSave = true; 
        };

        function autoSaveToFirebase() {
            if (!currentUser || !canSave) return;
            canSave = false; 
            const timestamp = new Date().toLocaleString();
            const recordRef = ref(db, `user_progress/${currentUser.uid}`);
            const newRecordRef = push(recordRef);
            set(newRecordRef, {
                userName: currentUser.displayName,
                userEmail: currentUser.email,
                pose: currentMode,
                time: timestamp,
                score: "PERFECT"
            }).then(() => {
                saveStatusDiv.innerText = `✅ 已自動存檔 (${new Date().toLocaleTimeString()})`;
                setTimeout(() => { canSave = true; }, 5000); 
            });
        }

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.poseLandmarks) {
                drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#00FF00', lineWidth: 4});
                drawLandmarks(canvasCtx, results.poseLandmarks, {color: '#FF0000', lineWidth: 2, radius: 4});

                const rules = YOGA_DATABASE[currentMode];
                let perfectCount = 0;
                let errors = [];

                rules.forEach(rule => {
                    const p1 = results.poseLandmarks[rule.joints[0]];
                    const p2 = results.poseLandmarks[rule.joints[1]];
                    const p3 = results.poseLandmarks[rule.joints[2]];
                    if(p1 && p2 && p3) {
                        const angle = calculateAngle(p1, p2, p3);
                        if (angle < rule.min || angle > rule.max) errors.push(rule.msg);
                        else perfectCount++;
                    }
                });

                if (perfectCount === rules.length) {
                    poseResultsDiv.innerHTML = `<p class="perfect">PERFECT!</p>`;
                    autoSaveToFirebase(); 
                } else {
                    poseResultsDiv.innerHTML = errors.map(e => `<p class="error">${e}</p>`).join('');
                }
            }
            canvasCtx.restore();
        }

        const pose = new Pose({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`});
        pose.setOptions({ modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        pose.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => { await pose.send({image: videoElement}); },
            // 修正：這裡不要寫死 width/height，讓它跟隨裝置
            width: undefined, 
            height: undefined
        });
        
    </script>
</body>
</html>
